name: Vondst Android-app bouwen

on:
  push:
    branches: [main]
    paths:
      - 'vondst/**'
      - 'vondst-android/**'
      - '.github/workflows/vondst-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vondst-android
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vondst
            vondst-android
            .github
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('vondst-android/package.json', 'vondst-android/scripts/voorbereiden.js') }}
          restore-keys: gradle-

      - name: Pakketten installeren
        working-directory: vondst-android
        run: npm install --no-audit --no-fund

      - name: Webapp klaarzetten als Android-project
        working-directory: vondst-android
        run: node scripts/voorbereiden.js

      - name: Spraakmodel (Nederlands, offline) ophalen
        uses: actions/cache@v4
        id: model
        with:
          path: vondst-android/model-nl
          key: vosk-model-small-nl-0.22

      - name: Spraakmodel downloaden
        if: steps.model.outputs.cache-hit != 'true'
        working-directory: vondst-android
        run: |
          curl -L --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-nl-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-nl-0.22 model-nl
          rm model.zip

      - name: Spraakmodel in de app zetten
        working-directory: vondst-android
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/model-nl
          cp -r model-nl android/app/src/main/assets/model-nl
          du -sh android/app/src/main/assets/model-nl
          echo "Woorden in het model:"
          for w in hebbes vondst gevonden foto hebbe; do n=$(grep -a -o -w "$w" model-nl/graph/Gr.fst | wc -l); echo "  $w: $n keer in Gr.fst"; done
          ls model-nl model-nl/graph | head -30

      - name: App-icoon maken
        working-directory: vondst-android
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#b2ebfc' --splashBackgroundColor '#eef4fa'

      - name: APK bouwen
        working-directory: vondst-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../Vondst.apk

      - name: Downloadlink bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vondst-app --yes --cleanup-tag || true
          gh release create vondst-app Vondst.apk \
            --title "Vondst-app (testversie Android)" \
            --notes "Automatisch gebouwd op $(date -u '+%Y-%m-%d %H:%M') UTC vanaf ${GITHUB_SHA::7}. Installeer Vondst.apk op je Android-telefoon." \
            --latest

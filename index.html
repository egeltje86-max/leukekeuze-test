<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LeukeKeuze – testversie</title>
<style>
:root{--bg:#f7f3ec;--kaart:#fff;--inkt:#1f1a17;--zacht:#776c63;--lijn:#e8dfd2;--goud:#c69a3f;--goud2:#f3e7cc;--nacht:#15202e;--groen:#2f7d4f;--oranje:#b8661c;--rood:#b3392f;--r:14px}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--inkt)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
/* balk */
.spook{background:var(--nacht);color:#e9d9b4;font-size:13px;text-align:center;padding:5px 8px}
header{background:var(--kaart);border-bottom:1px solid var(--lijn);position:sticky;top:0;z-index:20}
.kop{display:flex;align-items:center;gap:14px;height:66px}
.logo{font-family:Georgia,serif;font-size:26px;white-space:nowrap}.logo b{color:var(--goud);font-weight:400}
.zoek{flex:1;max-width:460px;position:relative}.zoek input{width:100%;padding:11px 16px;border:1px solid var(--lijn);border-radius:999px;background:var(--bg)}
.modus{margin-left:auto;display:flex;gap:6px}.modus a{padding:8px 14px;border-radius:999px;border:1px solid var(--lijn);font-size:14px;white-space:nowrap}
.modus a.aan{background:var(--nacht);color:#fff;border-color:var(--nacht)}
.menu{background:var(--kaart);border-bottom:1px solid var(--lijn);overflow-x:auto}.menu .wrap{display:flex;gap:4px;padding-top:6px;padding-bottom:6px}
.menu a{padding:7px 12px;border-radius:999px;font-size:14px;white-space:nowrap;color:var(--zacht)}.menu a:hover,.menu a.aan{background:var(--goud2);color:var(--inkt)}
.menu a.leeg{opacity:.45}
/* algemeen */
main{padding:22px 0 60px}.kruim{font-size:14px;color:var(--zacht);margin-bottom:6px}.kruim a:hover{text-decoration:underline}
h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:4px 0 6px}h2{font-size:20px;margin:30px 0 12px}
.intro{color:var(--zacht);margin:0 0 20px;max-width:720px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tegel{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:18px;display:block;transition:.15s;min-height:96px}
.tegel:hover{border-color:var(--goud);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.05)}
.tegel b{display:block;font-size:17px;margin-bottom:4px}.tegel small{color:var(--zacht)}.tegel.leeg{opacity:.55}
.leegbord{background:var(--kaart);border:1px dashed var(--lijn);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--zacht)}
.leegbord b{display:block;color:var(--inkt);font-size:18px;margin-bottom:4px}
.knop{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;border:1px solid var(--nacht);background:var(--nacht);color:#fff;cursor:pointer;font-size:15px}
.knop.licht{background:var(--kaart);color:var(--inkt);border-color:var(--lijn)}.knop.goud{background:var(--goud);border-color:var(--goud);color:#fff}
.knop.klein{padding:5px 11px;font-size:13px}.knop:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--lijn);background:var(--kaart);cursor:pointer;font-size:14px;font-family:inherit;color:inherit}
.chip.aan{background:var(--goud2);border-color:var(--goud)}
.werkbalk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
select.kies{padding:8px 12px;border:1px solid var(--lijn);border-radius:10px;background:var(--kaart)}
/* product */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.prod{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .foto{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--lijn)}
.prod img{max-width:92%;max-height:92%;object-fit:contain}
.prod .info{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .titel{font-weight:600;line-height:1.3}.prod .winkel{font-size:13px;color:var(--zacht)}
.prijs{font-weight:700;font-size:17px}.oud{color:var(--zacht);text-decoration:line-through;font-weight:400;font-size:14px;margin-left:6px}
.prod .waarom{font-size:14px;color:var(--zacht)}.prod .naar{margin-top:auto;padding-top:8px}
.prod .naar a{display:block;text-align:center;padding:9px;border-radius:10px;background:var(--goud2);font-weight:600;font-size:14px}
.prod .naar a:hover{background:var(--goud);color:#fff}
/* werkplaats */
.werk{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.paneel{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:16px}
.boom{font-size:15px}.boom .afd{margin:2px 0}.boom .rij{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer}
.boom .rij:hover{background:var(--bg)}.boom .rij.aan{background:var(--goud2)}
.boom .rij .n{margin-left:auto;font-size:12px;color:var(--zacht)}.boom .rij .acties{display:none;gap:2px}.boom .rij:hover .acties{display:flex}
.boom .acties button{border:0;background:none;cursor:pointer;padding:0 3px;color:var(--zacht);font-size:13px}.boom .acties button:hover{color:var(--inkt)}
.boom .g1{padding-left:22px;font-weight:600}.boom .g2{padding-left:40px}.boom .af{font-weight:700}
.boom .plus{padding-left:40px;font-size:13px;color:var(--goud);cursor:pointer;padding-top:3px;padding-bottom:3px}.boom .plus.g{padding-left:22px}
.veld{margin-bottom:14px}.veld label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.veld input,.veld select,.veld textarea{width:100%;padding:10px 12px;border:1px solid var(--lijn);border-radius:10px;background:#fff}
.veld textarea{min-height:70px;resize:vertical}.veld .hulp{font-size:13px;color:var(--zacht);margin-top:3px}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid{display:grid;grid-template-columns:1fr 260px;gap:22px}
.voorbeeld .prod{max-width:260px}
.keur{list-style:none;padding:0;margin:0 0 14px;font-size:14px}.keur li{padding:4px 0;display:flex;gap:8px}
.keur .ok{color:var(--groen)}.keur .let{color:var(--oranje)}.keur .fout{color:var(--rood)}
.lijst{width:100%;border-collapse:collapse;font-size:14px}.lijst td,.lijst th{padding:8px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:middle}
.lijst img{width:46px;height:46px;object-fit:contain;background:#fff;border:1px solid var(--lijn);border-radius:8px}
.pil{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--goud2)}.pil.twijfel{background:#fde8cf}
.cijfers{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 20px}.cijfer{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:14px 18px;min-width:150px}
.cijfer b{display:block;font-size:26px}.cijfer span{color:var(--zacht);font-size:14px}
.feedzoek{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.feedzoek input{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--lijn);border-radius:10px}.feedzoek input[type=checkbox]{flex:none;min-width:0;padding:0;width:auto}
.feedlijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-height:520px;overflow:auto;padding:2px}
.fk{border:1px solid var(--lijn);border-radius:10px;padding:8px;font-size:13px;background:#fff;display:flex;flex-direction:column;gap:4px}
.fk img{width:100%;aspect-ratio:1;object-fit:contain}.fk b{font-size:13px;line-height:1.25;max-height:3.8em;overflow:hidden}.fk .knop{margin-top:auto;justify-content:center}
.vinkjes{display:flex;flex-wrap:wrap;gap:6px}.vinkjes label{display:inline-flex;align-items:center;gap:4px;font-weight:400;font-size:14px;border:1px solid var(--lijn);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;margin:0}
.vinkjes input{width:auto;margin:0}.ster{color:var(--goud);font-size:13px}.lever{font-size:12px;color:var(--groen)}
.verborgen{position:relative}.verborgen::after{content:attr(data-teller);position:absolute;top:8px;right:10px;font-size:11px;background:#fde8cf;color:var(--oranje);padding:1px 7px;border-radius:999px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.pp .grootfoto{background:#fff;border:1px solid var(--lijn);border-radius:var(--r);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.pp .grootfoto img{max-width:90%;max-height:90%;object-fit:contain}.pp h1{font-size:30px}.pp .koop{display:block;text-align:center;padding:15px;border-radius:12px;background:var(--goud);color:#fff;font-weight:700;font-size:17px;margin:16px 0 8px}
.pp .koop:hover{filter:brightness(.95)}.pp .klein{font-size:13px;color:var(--zacht)}.kenmerk{display:inline-block;margin:0 6px 6px 0;padding:3px 10px;border-radius:999px;background:var(--goud2);font-size:13px}
.prod .titel a:hover,.prod .foto a{text-decoration:none}.prod .titel a:hover{text-decoration:underline}
footer.voet{border-top:1px solid var(--lijn);background:var(--kaart);margin-top:40px}footer.voet .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;padding:22px 16px;font-size:14px;color:var(--zacht)}footer.voet a:hover{color:var(--inkt)}
.uitleg{max-width:720px}.uitleg h2{margin-top:26px}.uitleg p{margin:6px 0}
@media (max-width:860px){.pp{grid-template-columns:1fr;gap:16px}}
.hart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--lijn);background:#fff;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.hart.aan{color:#d1435b;border-color:#f3c3cc}.prod{position:relative}.lijstkop{display:flex;align-items:center;gap:6px}
.hartlink{position:relative}.hartlink b{position:absolute;top:-6px;right:-8px;background:#d1435b;color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.melding{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nacht);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.melding.zie{opacity:1}
@media (max-width:860px){.werk,.formgrid{grid-template-columns:1fr}.modus a{padding:7px 10px;font-size:13px}.kop{flex-wrap:wrap;height:auto;padding:10px 16px}.zoek{order:3;max-width:none;flex-basis:100%}h1{font-size:28px}}
/* verbeterronde 4-11: telefoon, vertrouwen, levertijd */
.best{font-size:12.5px;color:var(--groen);font-weight:600}.lever{font-size:12.5px;color:var(--zacht)}
.vertrouw{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--zacht);margin:4px 0 18px}.vertrouw span::before{content:'✓ ';color:var(--groen);font-weight:700}
.afdtegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 8px}
.afdtegel{display:flex;align-items:center;gap:10px;background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:10px 12px;font-weight:600;font-size:15px;line-height:1.2}
.afdtegel i{font-style:normal;font-size:24px}@media (min-width:861px){.afdtegels{grid-template-columns:repeat(5,1fr)}}.afdtegel:hover{border-color:var(--goud)}
.gids{background:var(--kaart);border:1px solid var(--lijn);border-left:4px solid var(--goud);border-radius:var(--r);padding:12px 16px;margin:0 0 16px;font-size:15px}
.gids b{display:block;margin-bottom:2px}
.wiezijnwij{background:var(--goud2);border-radius:var(--r);padding:18px 20px;margin:28px 0 0}
.wiezijnwij h2{margin-top:0}.wiezijnwij ul{margin:8px 0 10px;padding-left:20px}.wiezijnwij li{margin:4px 0}
@media (max-width:600px){
 .prods{grid-template-columns:1fr 1fr;gap:10px}
 .prod .info{padding:9px 10px 10px;gap:3px}
 .prod .titel{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .prijs{font-size:16px}.oud{font-size:12px}
 .prod .waarom,.prod .kleurrij{display:none}
 .prod .winkel{font-size:12px}
 .prod .naar a{padding:8px 4px;font-size:13px}
 .hart{width:30px;height:30px;font-size:15px;top:6px;right:6px}
 .raster{grid-template-columns:1fr 1fr;gap:10px}.tegel{padding:12px;min-height:0}
 .afdtegels{grid-template-columns:1fr 1fr;gap:8px}.afdtegel{padding:9px 10px;font-size:14px}.afdtegel i{font-size:20px}
 .vertrouw{font-size:13px;gap:4px 12px}
 .modus{margin-left:0;max-width:100%;overflow-x:auto;scrollbar-width:none}.modus::-webkit-scrollbar{display:none}
 .werkbalk{gap:8px;margin-bottom:6px}
 .werkbalk .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;max-width:100%}.werkbalk .chips::-webkit-scrollbar{display:none}
 .werkbalk .chip{padding:5px 11px;font-size:13px;white-space:nowrap;flex:none}
 .werkbalk > div:last-child{display:grid !important;grid-template-columns:1fr 1fr;gap:6px !important;width:100%}
 .werkbalk select.kies{padding:6px 8px;font-size:13px;width:100%;min-width:0}
 .werkbalk > div:last-child .chip{padding:6px 9px;text-align:center}
 .gids{padding:9px 12px;font-size:14px;margin-bottom:10px}
 h1{margin-bottom:8px}
}
/* ===== LeukeKeuze 4.0 – mobiel eerst en toegankelijk (ontwerp Nova + Claude, 4-11-2026) =====
   Grote knoppen (minstens 48 px), tekst minstens 16-17 px, sterk contrast, niets dat vanzelf beweegt,
   geen menu dat je opzij moet schuiven, en de terugknop brengt je altijd terug waar je was. */
:root{--inkt:#1c2b3f;--zacht:#5b5249;--goudtekst:#7d5f1c;--focus:#1c5fd1}
body{font-size:17px}
.logo b{color:var(--goudtekst)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.vb{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:static}
.modus a{min-height:44px;display:inline-flex;align-items:center;font-size:15px}
.modus a.aan{background:var(--nacht);color:#fff}
.zoekbalk{position:sticky;top:0;z-index:20;background:var(--kaart);border-bottom:1px solid var(--lijn)}
.zoekbalk .wrap{padding-top:8px;padding-bottom:8px}
.zoekbalk .zoek{max-width:680px;margin:0 auto}
.zoekbalk input{min-height:50px;padding:12px 18px;font-size:17px;background:#fff;border:2px solid var(--lijn);-webkit-appearance:none;appearance:none}
.zoekbalk input:focus{border-color:var(--goud)}
.menu .wrap{flex-wrap:wrap}.menu{overflow:visible}
.onderbalk{display:none}
.terug{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 16px 8px 12px;border:1px solid var(--lijn);border-radius:999px;background:var(--kaart);font-size:17px;cursor:pointer;margin:0 0 12px;color:var(--inkt)}
main{padding-top:14px}
h1{color:var(--inkt)}
.intro,.kruim{color:var(--zacht)}
.kruim{font-size:15px}
/* homepage */
.welkom{font-size:30px;margin:6px 0 4px}
.grootknoppen{display:grid;gap:12px;margin:14px 0 26px;max-width:680px}
@media (min-width:700px){.grootknoppen{grid-template-columns:1fr 1fr}}
.grootknop{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 18px;border-radius:16px;font-size:20px;font-weight:700;border:2px solid var(--goud);background:var(--goud2);color:var(--inkt)}
.grootknop.tweede{background:var(--kaart);border-color:var(--lijn)}
.grootknop i{font-style:normal;font-size:30px;line-height:1}
.grootknop small{display:block;font-weight:400;font-size:15px;color:var(--zacht);margin-top:2px}
.grootknop:hover{border-color:var(--goud);filter:brightness(.98)}
.wiezijnwij li{font-size:16px}
/* productkaarten: vanzelf 1 per rij als het scherm smal is of de tekst groot staat */
.prods{grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:12px}
.prod .titel{font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .info{padding:10px 12px 12px;gap:4px}
.prod .winkel{font-size:15px;color:var(--zacht)}
.prijs{font-size:19px;color:var(--inkt)}
.prod .waarom{display:none}
.prod .naar a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px;font-size:15px;color:var(--inkt)}
.hart{width:48px;height:48px;top:4px;right:4px;font-size:22px}
.best{font-size:14px;color:#1f6b40}
.lever{font-size:14px}
.ster{font-size:14px}
/* lijstbalk: Prijs / Sorteren / Filters als grote knoppen, de keuzes in een paneel van onderen */
.lijstbalk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.balkknop{min-height:48px;padding:8px 16px;border:1px solid var(--lijn);border-radius:999px;background:var(--kaart);font-size:16px;cursor:pointer;color:var(--inkt)}
.balkknop b{font-weight:700}
.filterpil{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:999px;background:var(--goud2);border:1px solid var(--goud);font-size:16px;cursor:pointer;color:var(--inkt)}
.aantal{font-size:15px;color:var(--zacht);margin:0 0 10px}
.meerknop{display:flex;align-items:center;justify-content:center;width:100%;max-width:440px;margin:18px auto 0;min-height:54px;border-radius:14px;border:2px solid var(--goud);background:var(--kaart);font-size:18px;font-weight:700;cursor:pointer;color:var(--inkt)}
.blad{position:fixed;inset:0;z-index:60;background:rgba(15,22,34,.5);display:flex;align-items:flex-end;justify-content:center}
.blad[hidden]{display:none}
.blad .vel{background:var(--kaart);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.blad h2{margin:0 0 12px;font-size:21px}
.keuzeknop{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:10px 16px;margin:0 0 8px;border:1px solid var(--lijn);border-radius:12px;background:#fff;font-size:18px;cursor:pointer;text-align:left;color:var(--inkt)}
.keuzeknop.aan{border:2px solid var(--goud);background:var(--goud2);font-weight:700}
.keuzeknop.aan::after{content:'✓';font-size:20px}
.keuzeknop.sluit{justify-content:center;background:var(--nacht);color:#fff;border-color:var(--nacht);margin-top:6px}
/* rondkijken */
.afdtegels.groot{grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:10px}
.afdtegels.groot .afdtegel{min-height:76px;font-size:17px;padding:12px 14px}
.afdtegels.groot .afdtegel i{font-size:28px}
.springknoppen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5rem),1fr));gap:8px;margin:0 0 8px}
.springknop{display:flex;align-items:center;min-height:50px;padding:8px 12px;border:1px solid var(--lijn);border-radius:12px;background:var(--kaart);font-size:16px;font-weight:600;cursor:pointer;text-align:left;color:var(--inkt)}
.groepkop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:28px 0 10px;scroll-margin-top:80px}
.groepkop h2{margin:0}
.allebekijk{display:flex;align-items:center;justify-content:center;min-height:50px;margin:10px 0 0;border:1px solid var(--lijn);border-radius:12px;background:var(--kaart);font-weight:700;font-size:17px}
details.gids summary{cursor:pointer;font-weight:700;min-height:32px;list-style-position:inside}
details.gids p{margin:6px 0 0}
/* VONK */
.vonk{max-width:600px;margin:0 auto}
.antwoorden{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.antwoord{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--goud);background:var(--goud2);font-size:16px;color:var(--inkt)}
.vraagkaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:18px;padding:18px 16px;min-height:430px}
.vraagkaart .stap{font-size:15px;color:var(--zacht);margin:0 0 4px}
.vraagkaart h1{font-size:26px;margin:0 0 16px}
.opties{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5rem),1fr));gap:10px}
.optie{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 14px;border:2px solid var(--lijn);border-radius:14px;background:#fff;font-size:18px;font-weight:600;line-height:1.2;color:var(--inkt)}
.optie i{font-style:normal;font-size:26px;line-height:1}
.optie:hover{border-color:var(--goud)}
.vorige{margin-top:16px}
/* cadeauresultaten */
.uitkomst h1{font-size:26px;margin-bottom:8px}
.kiesrij{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.kiesrij .label{width:100%;font-weight:700;font-size:16px;margin-bottom:-2px}
.keus{display:inline-flex;align-items:center;min-height:46px;padding:8px 14px;border-radius:999px;border:1px solid var(--lijn);background:#fff;font-size:16px;cursor:pointer;color:var(--inkt)}
.keus.aan{border:2px solid var(--goud);background:var(--goud2);font-weight:700}
.keus.aan::before{content:'✓\00a0'}
.keus.meer{border-style:dashed}
.tip{position:relative;border:2px solid var(--goud);border-radius:16px;background:var(--kaart);display:grid;grid-template-columns:minmax(90px,140px) 1fr;gap:14px;padding:12px;margin:0 0 14px;align-items:center}
.tip .tfoto{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff}
.tip .tfoto img{max-width:100%;max-height:100%;object-fit:contain}
.tip .tlabel{display:inline-block;font-weight:700;font-size:15px;background:var(--goud2);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.tip .ttitel{font-weight:700;font-size:17px;line-height:1.3}
.tip .treden{font-size:15px;color:var(--zacht);margin-top:4px}
.melding2{background:var(--goud2);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:16px}
.melding2 .keus{margin-top:8px}
.knoprij{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 0}
.knoprij .meerknop{margin:0}
.lichtknop{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px 18px;border-radius:14px;border:1px solid var(--lijn);background:var(--kaart);font-size:17px;cursor:pointer;color:var(--inkt)}
/* productpagina */
.pp .koop{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:18px}
.pp .klein{font-size:15px}
details.meerinfo{margin:12px 0;border-top:1px solid var(--lijn);padding-top:10px}
details.meerinfo summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.prijsdatum{font-size:14px;color:var(--zacht);margin-top:2px}
/* verlanglijst */
.favrij{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;padding:10px;margin:0 0 10px}
.favrij .ffoto{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff}
.favrij img{max-width:100%;max-height:100%;object-fit:contain}
.favrij .fnaam{font-weight:700;line-height:1.3}
.favrij .facties{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.favrij .facties a,.favrij .facties button{display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--lijn);background:#fff;font-size:15px;cursor:pointer;color:var(--inkt)}
.favrij .facties a.koopje{background:var(--goud2);border-color:var(--goud);font-weight:700}
.laden{padding:40px 10px;text-align:center;color:var(--zacht);font-size:18px}
@media (max-width:860px){
 .menu{display:none}
 header .modus{display:none}
 .kop{height:auto;padding:10px 16px;gap:10px}
 .logo{font-size:23px}
 .onderbalk{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--kaart);border-top:1px solid var(--lijn);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
 .onderbalk a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;font-size:14px;gap:3px;color:var(--inkt);position:relative;border-top:3px solid transparent}
 .onderbalk a i{font-style:normal;font-size:22px;line-height:1}
 .onderbalk a.aan{border-top-color:var(--goud);font-weight:700;background:var(--goud2)}
 .onderbalk b{position:absolute;top:5px;left:calc(50% + 8px);background:#c0334f;color:#fff;border-radius:999px;font-size:12px;padding:0 6px;line-height:18px}
 body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
 .melding{bottom:calc(80px + env(safe-area-inset-bottom))}
 h1{font-size:27px}
 .pp h1{font-size:24px}
}
@media (max-width:600px){
 .prods{grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:10px}
 .prod .titel{font-size:15.5px;-webkit-line-clamp:2}
 .prijs{font-size:18px}
 .prod .winkel{font-size:14px}
 .prod .naar a{min-height:44px;font-size:14.5px;padding:6px 4px}
 .hart{width:48px;height:48px;font-size:21px;top:4px;right:4px}
 .afdtegels.groot{grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5rem),1fr))}
 .afdtegels.groot .afdtegel{font-size:16px}
}
.pp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pp>*{min-width:0}
@media (max-width:860px){.pp{grid-template-columns:minmax(0,1fr)}}
.pp .grootfoto img,.prod img,.tip img,.favrij img{width:auto;height:auto}
main{overflow-wrap:break-word}
.grootknop span,.optie span,.tip>div,.favrij>div{min-width:0;overflow-wrap:anywhere}
@media (max-width:340px){.tip{grid-template-columns:84px 1fr;gap:10px;padding:10px}.tip .hart{top:auto;bottom:6px}.grootknop{font-size:18px;padding:12px 14px;gap:10px}.grootknop i{font-size:24px}}
/* heel smal scherm of grote zoom: alleen de pictogrammen in de onderbalk (de namen blijven voor schermlezers) */
@media (max-width:300px){.onderbalk a{font-size:0;gap:0}.onderbalk a i{font-size:26px}.onderbalk b{font-size:12px}}
[hidden]{display:none!important}
.geenfoto::after,.fotovolgt{content:'foto volgt';color:var(--zacht);font-size:15px;background:#f3efe8;border-radius:10px;padding:6px 12px}
.fotovolgt::after{content:none}
@media (max-width:860px){.uitkomst h1{font-size:24px;margin:0 0 8px}}
.uitkomst .antwoorden{margin-bottom:8px}.uitkomst .kiesrij{margin-bottom:8px}
button.antwoord{cursor:pointer;font-family:inherit}
.favweg{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--goud2);border:1px dashed var(--goud);border-radius:14px;padding:12px;margin:0 0 10px;font-size:16px}
/* terugknop: op de telefoon naast het zoekveld (scheelt ruimte en blijft altijd bereikbaar), op de computer boven de pagina */
.zoekrij{display:flex;align-items:center;gap:8px}.zoekrij .zoek{flex:1;min-width:0}
.balkterug{margin:0;flex:none;min-height:50px}
@media (min-width:861px){.balkterug{display:none!important}}
@media (max-width:860px){main .terug[data-terug]:not(.vorige):not(.lichtknop){display:none}.uitkomst h1{font-size:23px}}
.uitkomst .kiesrij .label{width:auto;margin:0 4px 0 0}
@media (max-width:860px){.uitkomst .keus,.uitkomst .antwoord{min-height:44px;padding:6px 12px;font-size:15.5px}.uitkomst .antwoorden,.uitkomst .kiesrij{gap:6px;margin-bottom:6px}.uitkomst .aantal{margin-bottom:6px}main{padding-top:10px}}
/* heel smal scherm (zoals 320 px): één product per rij, foto links en tekst rechts, zodat prijs en winkel meteen te zien zijn */
@media (max-width:359px) and (min-width:240px){
 .prods{grid-template-columns:1fr}
 .prod{display:grid;grid-template-columns:112px 1fr;align-items:start}
 .prod .foto{border-bottom:0;border-right:1px solid var(--lijn);height:100%;min-height:112px;aspect-ratio:auto}
 .prod .hart{top:auto;bottom:6px;right:6px}
 .prod .info{padding:8px 10px 10px;padding-bottom:60px}
}
/* heel smal (grote zoom): terugknop weer boven de pagina, zodat het zoekveld genoeg ruimte heeft */
@media (max-width:300px){.balkterug{display:none!important}main .terug[data-terug]{display:inline-flex!important}}
/* duidelijke scheiding per soort: eigen vlak en een naambalk die bovenaan blijft staan zolang je in die soort bent */
.groepvak{background:var(--kaart);border:1px solid var(--lijn);border-radius:18px;padding:0 12px 14px;margin:22px 0 0}
.groepbalk{position:sticky;top:var(--zb,66px);z-index:12;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--nacht);color:#fff;margin:0 -12px 12px;padding:10px 16px;border-radius:18px 18px 0 0;min-height:50px}
.groepbalk .gnaam{font-weight:700;font-size:19px;font-family:inherit;margin:0;color:#fff;line-height:1.25}
.groepbalk .gtel{font-size:15px;color:#e9d9b4;white-space:nowrap}
.groepbalk.vast{margin:4px 0 12px;border-radius:14px}
.groepbalk.vast h1{font-size:23px}
.springknop .n{margin-left:auto;font-weight:400;color:var(--zacht);font-size:14px;padding-left:8px}
.eindeblok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-top:3px solid var(--goud);margin:22px 0 0;padding:16px 0 0;font-size:17px}
.eindeblok .meerknop,.eindeblok .lichtknop{margin:0;width:100%;max-width:440px}
.groepbalk{flex-wrap:wrap}.groepbalk .gnaam{min-width:0;overflow-wrap:anywhere}
/* ===== Knopsysteem: nieuw voorstel (alleen op de voorbeeldpagina #/knoppen) ===== */
.kvb{background:var(--kaart);border:1px solid var(--lijn);border-radius:18px;padding:14px;margin:0 0 16px}
.kvb h2{margin:0 0 8px}
.kvb-twee{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:16px}
.kvb-twee>div{min-width:0}
.kvb-lijst{display:grid;gap:14px}
.kvb-label{display:inline-block;font-size:14px;font-weight:700;color:var(--zacht);background:#efe9df;border-radius:999px;padding:2px 10px;margin:0 0 8px}
.kvb-label.nieuw{background:var(--goud2);color:var(--goudtekst)}
.n-hoofd,.n-tweede,.n-rustig,.n-keus,.n-winkel,.n-optie,.n-tegel,.n-thuis{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.n-hoofd svg,.n-tweede svg,.n-rustig svg,.n-winkel svg,.n-thuis>svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n-hoofd{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 24px;border:0;border-radius:14px;background:linear-gradient(180deg,#d6ae5a,#c69a3f);color:var(--inkt);font-weight:700;font-size:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 8px rgba(125,95,28,.25)}
.n-tweede{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border:1.5px solid #cfc2ab;border-radius:14px;background:#fff;color:var(--inkt);font-weight:700;font-size:17px;box-shadow:0 1px 3px rgba(28,43,63,.06)}
.n-rustig{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border:0;border-radius:14px;background:var(--goud2);color:var(--inkt);font-weight:600;font-size:16px}
.n-rustig svg{width:18px;height:18px}
.n-keus{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 16px;border:1.5px solid #d9cdb8;border-radius:999px;background:#fff;color:var(--inkt);font-size:16px}
.n-keus.aan{background:var(--inkt);border-color:var(--inkt);color:#fff;font-weight:700}
.n-keus.aan::before{content:'✓'}
.n-hoofd:active,.n-tweede:active,.n-rustig:active,.n-keus:active,.n-winkel:active,.n-optie:active,.n-tegel:active,.n-thuis:active{filter:brightness(.94)}
@media (prefers-reduced-motion:no-preference){.n-hoofd,.n-tweede,.n-rustig,.n-keus,.n-winkel,.n-optie,.n-tegel,.n-thuis,.n-hart{transition:filter .12s,transform .12s,border-color .12s}.n-hoofd:active,.n-tweede:active,.n-winkel:active,.n-optie:active,.n-tegel:active,.n-thuis:active{transform:scale(.98)}}
/* homepagekaarten */
.n-thuis-rij{display:grid;gap:12px}
.n-thuis{display:flex;align-items:center;gap:14px;min-height:80px;padding:14px 16px;border-radius:18px;border:1.5px solid var(--lijn);background:#fff;color:var(--inkt)}
.n-thuis.hoofd{border:2px solid var(--goud);background:linear-gradient(135deg,#fbf3e2,#f3e7cc)}
.n-thuis b{display:block;font-size:19px;line-height:1.25}.n-thuis small{display:block;font-size:15px;color:var(--zacht);margin-top:2px}
.n-thuis>span:nth-child(2){flex:1;min-width:0}
.n-thuis>svg{color:var(--goudtekst)}
.n-rond{display:inline-flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;border-radius:50%;background:var(--goud2);font-size:24px;line-height:1}
.n-thuis.hoofd .n-rond{background:#fff}
/* onderbalk */
.n-onder,.kvb-onder{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--lijn);border-radius:14px;overflow:hidden}
.kvb-onder a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;font-size:13px;gap:3px;border-top:3px solid transparent}
.kvb-onder a i{font-style:normal;font-size:22px}.kvb-onder a.aan{border-top-color:var(--goud);font-weight:700;background:var(--goud2)}
.n-onder a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;font-size:13.5px;color:var(--inkt)}
.n-onder svg{width:26px;height:26px;padding:3px 14px;box-sizing:content-box;border-radius:999px;fill:none;stroke:var(--inkt);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.n-onder a.aan{font-weight:700}.n-onder a.aan svg{background:var(--goud2);fill:var(--goud);stroke:var(--goudtekst)}
/* productkaart */
.n-kaart{border-radius:18px;box-shadow:0 2px 10px rgba(28,43,63,.06)}
.n-winkel{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;margin-top:auto;padding:8px;border-radius:12px;background:var(--goud2);color:var(--inkt);font-weight:700;font-size:15px}
.n-hart{position:absolute;top:6px;right:6px;z-index:2;width:48px;height:48px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(28,43,63,.16);display:flex;align-items:center;justify-content:center;cursor:pointer}
.n-hart svg{width:24px;height:24px;fill:none;stroke:var(--inkt);stroke-width:1.9}
.n-hart.aan svg{fill:#c0334f;stroke:#c0334f}
@media (prefers-reduced-motion:no-preference){.n-hart.aan svg{animation:n-pop .25s ease-out}@keyframes n-pop{50%{transform:scale(1.2)}}}
/* VONK en categorie */
.n-optie,.n-tegel{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border:1.5px solid var(--lijn);border-radius:16px;background:#fff;color:var(--inkt);font-size:18px;font-weight:600;line-height:1.2}
.n-optie:hover,.n-optie:focus-visible,.n-optie:active,.n-tegel:hover{border-color:var(--goud)}
.n-tegel b{display:block;font-size:17px}.n-tegel small{display:block;font-size:14px;font-weight:400;color:var(--zacht);margin-top:2px}
.n-tegel>span:last-child,.n-optie>span:last-child{min-width:0;overflow-wrap:anywhere}

.n-uit{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 20px;border-radius:14px;background:#e6e2db;color:#4a4540;font-weight:600;font-size:17px;border:0;cursor:not-allowed}
.n-focus{outline:3px solid var(--focus);outline-offset:2px}
.n-gedrukt{filter:brightness(.94);transform:scale(.98)}
.kvb-standen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:12px;align-items:end}
.kvb-standen small{display:block;font-size:14px;color:var(--zacht);margin-bottom:6px}
.kvb-standen>div>*:last-child{width:100%}
.n-tegel{gap:10px;padding:10px 12px}.n-tegel .n-rond{width:40px;height:40px;font-size:21px}.n-tegel b{font-size:16px;hyphens:auto;-webkit-hyphens:auto}
.n-tegel>span:last-child,.n-optie>span:last-child{overflow-wrap:break-word}
/* ===== Uiterlijk van leukekeuze.nl (de oude site, die Marius mooi vindt) met de nieuwe bediening =====
   Lichte achtergrond, donkerblauwe kop en onderbalk, goud als accent, witte productkaarten met het winkellabel in goud,
   grote prijs, donker hartje op de foto, gouden knop 'Filter & sorteren' onderin. Lettertypes: Manrope, Inter, Playfair. */
@font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/manrope.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/playfair.woff2) format('woff2')}
:root{--bg:#F7F3EC;--kaart:#fff;--inkt:#141A2A;--zacht:#4F556A;--lijn:rgba(10,16,32,.12);--navy:#0A1020;--nacht:#0A1020;--goud:#B8862E;--goud-licht:#F2CB74;--goudtekst:#8F6620;--goud2:#F3E7CC;--goud-verloop:linear-gradient(180deg,#F4D07D 0%,#D9A443 100%);--f-ui:'Manrope',system-ui,sans-serif;--f-tekst:'Inter',system-ui,sans-serif;--f-kop:'Playfair Display',Georgia,serif}
body{font-family:var(--f-tekst);background:var(--bg);color:var(--inkt)}
h1{font-family:var(--f-kop);font-weight:500;color:var(--inkt)}
h2,h3,.knop,button,.grootknop,.optie,.keus,.springknop,.afdtegel,.meerknop,.lichtknop,.allebekijk,.onderbalk a,.modus a{font-family:var(--f-ui)}
/* kop en zoekbalk: donkerblauw */
header{background:var(--navy);border-bottom:0;color:#fff}
.logo{display:inline-flex;align-items:center;gap:9px;font:800 23px/1 var(--f-ui);letter-spacing:-.02em;color:#fff}
.logo svg{width:30px;height:30px;flex:none}.logo b{color:var(--goud-licht);font-weight:800}
.modus a{border-color:rgba(255,255,255,.18);color:#F4ECDD}.modus a.aan{background:var(--goud-verloop);color:var(--navy);border-color:transparent}
.kophart{display:none;position:relative;margin-left:auto;width:46px;height:46px;border-radius:50%;align-items:center;justify-content:center;color:#F4ECDD}
.kophart svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kophart b{position:absolute;top:2px;right:0;min-width:20px;height:20px;border-radius:999px;background:var(--goud-verloop);color:var(--navy);font:800 12px/20px var(--f-ui);text-align:center;padding:0 5px}
@media (max-width:860px){.kophart{display:inline-flex}}
.zoekbalk{background:var(--navy);border-bottom:0}
.zoekbalk .zoek{position:relative;display:flex;align-items:center;background:#FBF7EF;border-radius:999px;padding:4px 4px 4px 0}
.zoekbalk input{border:0;background:transparent;min-height:46px;flex:1;min-width:0;padding:10px 6px 10px 18px;font-family:var(--f-ui);font-size:16.5px;color:var(--inkt)}
.zoekbalk input:focus{outline:none}.zoekbalk .zoek:focus-within{box-shadow:0 0 0 3px #5b9cf5}
.zoekknop{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:var(--goud-verloop);color:var(--navy);display:grid;place-items:center;cursor:pointer}
.zoekknop svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
.balkterug{background:transparent;color:#F4ECDD;border-color:rgba(255,255,255,.3)}
.spook{background:#070C18}
.menu{background:var(--navy);border-bottom:1px solid rgba(217,168,72,.25)}.menu a{color:#F4ECDD}.menu a:hover,.menu a.aan{background:rgba(255,255,255,.08);color:var(--goud-licht)}
/* onderbalk: donkerblauw met lijnpictogrammen (ontwerp Nova) */

/* ---------- Zoeksuggesties tijdens het typen (onderzoek Baymard: 4 tot 8 op een telefoon) ----------
   Bovenaan afdelingen en soorten waar je woord in staat (anders opgemaakt), daaronder zoekwoorden uit onze producten.

    w.forEach(function (x, i) { if (x.length >= 3 && !HULPWOORD[vouw(x)] && !/^\d/.test(x)) voeg(x, 1); if (i < w.length - 1 && w[i].length >= 3 && w[i + 1].length >= 3 && !/^\d/.test(w[i + 1])) { voeg(w[i] + ' ' + w[i + 1], 1); if (i < w.length - 2 && w[i + 2].length >= 3 && !/^\d/.test(w[i + 2])) voeg(w[i] + ' ' + w[i + 1] + ' ' + w[i + 2], 1); } });

    a.groepen.forEach(function (g) { if (!productenIn(a.id + '/' + g.id, true).length) return; test(g.naam, '#/a/' + a.id + '/' + g.id, 'in ' + a.naam); g.vakjes.forEach(function (x) { if (productenIn(a.id + '/' + g.id + '/' + x.id, true).length >= ZICHTBAAR_VANAF) test(x.naam, '#/a/' + a.id + '/' + g.id + '/' + x.id, 'in ' + g.naam); }); });
